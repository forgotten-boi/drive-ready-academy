<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/study"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ title }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <p class="ukdp-section-intro" style="padding: 0 16px;">{{ intro }}</p>

  <ion-list inset="true">
    @for (row of rows(); track row.id) {
      <ion-item button="true" detail="false" (click)="open(row.id)">
        <ion-label>
          <h2>{{ row.name }}</h2>
          <p>{{ row.count }} question{{ row.count === 1 ? '' : 's' }}</p>
        </ion-label>
        @if (row.pct !== null) {
          <ion-badge slot="end" [color]="toneColor(row.pct)">{{ row.pct }}%</ion-badge>
        } @else if (mode === 'quiz') {
          <ion-note slot="end">New</ion-note>
        }
        <ion-icon aria-hidden="true" name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>
    }
  </ion-list>
</ion-content>
