<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Practice</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Practice</ion-title>
    </ion-toolbar>
  </ion-header>

  <p class="ukdp-section-intro" style="padding: 8px 16px 0;">
    Score yourself for real — timed, marked, and matched to the actual pass mark.
  </p>

  <ion-list inset="true">
    <ion-item button="true" detail="false" routerLink="/tabs/practice/quiz">
      <ion-icon aria-hidden="true" name="help-circle-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Category Quiz</h2>
        <p>10 random questions per category, instant feedback</p>
      </ion-label>
      <ion-icon aria-hidden="true" name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item button="true" detail="false" routerLink="/tabs/practice/mock-test">
      <ion-icon aria-hidden="true" name="timer-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Mock Test</h2>
        <p>{{ total }} questions, 57 minutes, pass mark {{ passMark }}/{{ total }}</p>
      </ion-label>
      @if (mockTest.hasResumableAttempt()) {
        <ion-badge slot="end" color="warning">Resume</ion-badge>
      }
      <ion-icon aria-hidden="true" name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
